<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>时光便签 Pro · 购买</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#F9FAFC;font-family:"Microsoft YaHei UI",sans-serif;color:#1F2430;}
  .card{background:#fff;border:1px solid #E3E6EE;border-radius:14px;padding:32px 36px;
        width:340px;text-align:center;box-shadow:0 6px 24px rgba(30,40,90,.08);}
  h1{font-size:20px;margin:0 0 6px;}
  .sub{color:#7A8090;font-size:13px;margin-bottom:18px;}
  #amount{font-size:26px;color:#3B62D9;}
  #qr{margin:18px auto;display:flex;justify-content:center;}
  .tip{color:#7A8090;font-size:12px;margin:8px 0;}
  code#key{display:block;background:#F1F4FA;border:1px dashed #B9C2D8;border-radius:8px;
        padding:10px;font-size:15px;letter-spacing:1px;margin:12px 0;word-break:break-all;}
  button{background:#3B62D9;color:#fff;border:0;border-radius:8px;padding:9px 22px;
        font-size:14px;cursor:pointer;}
  button:hover{background:#2E4FBB;}
  .err{color:#D9534F;font-size:13px;}
  .notice{color:#7A8090;font-size:13px;}
</style>
</head>
<body>
<div class="card">
  <h1>时光便签 Pro</h1>
  <div class="sub">买断授权 · 一码绑定 3 台</div>

  <div id="step-pay">
    <p>应付金额：<b id="amount">--</b></p>
    <div id="qr"></div>
    <p class="tip" id="qr-tip">请用支付宝扫码付款（无需登录）</p>
    <p class="tip" id="polling">等待付款中…</p>
  </div>

  <div id="step-done" hidden>
    <p>✅ 支付成功，你的激活码：</p>
    <code id="key"></code>
    <button id="copy">复制激活码</button>
    <p class="tip">打开时光便签 → 设置 → 粘贴激活码 → 激活</p>
  </div>

  <div id="step-err" hidden><p class="err" id="errmsg"></p></div>
</div>

<script>
// 二维码库多镜像加载：cdnjs 在境内偶发不可达，加载失败自动换镜像；
// 全部失败则降级为「付款链接可点可复制」，绝不让买家卡在空白二维码上。
const QR_CDNS = [
  "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js",
  "https://cdn.staticfile.net/qrcodejs/1.0.0/qrcode.min.js",
  "https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"
];
function loadQR(i) {
  return new Promise(resolve => {
    if (typeof QRCode !== "undefined" || i >= QR_CDNS.length)
      return resolve(typeof QRCode !== "undefined");
    const s = document.createElement("script");
    s.src = QR_CDNS[i];
    s.onload = () => resolve(typeof QRCode !== "undefined");
    s.onerror = () => loadQR(i + 1).then(resolve);
    document.head.appendChild(s);
  });
}
function renderPay(text) {
  const box = document.getElementById("qr");
  if (typeof QRCode !== "undefined") {
    new QRCode(box, { text: text, width: 220, height: 220 });
    return;
  }
  box.textContent = "";
  const a = document.createElement("a");
  a.href = text; a.target = "_blank"; a.textContent = text;
  a.style.cssText = "font-size:12px;word-break:break-all;color:#3B62D9;";
  box.appendChild(a);
  document.getElementById("qr-tip").textContent =
    "二维码组件加载失败：点上方链接付款，或复制链接到支付宝打开";
}

// 服务端基址：可用 ?api= 覆盖（默认生产 FC）
const BASE = (new URLSearchParams(location.search).get("api") ||
              "https://time-note-idrrtrkcmu.cn-shanghai.fcapp.run").replace(/\/$/, "");

async function post(path, body) {
  const r = await fetch(BASE + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  });
  return r.json();
}
function fail(msg, kind) {
  document.getElementById("step-pay").hidden = true;
  document.getElementById("step-err").hidden = false;
  const el = document.getElementById("errmsg");
  el.textContent = msg;
  el.className = kind === "notice" ? "notice" : "err";
}

function showKey(k) {
  document.getElementById("step-pay").hidden = true;
  document.getElementById("step-done").hidden = false;
  document.getElementById("key").textContent = k;
}

// 会话内刷新复用同一订单：金额与二维码不变，避免每次刷新新建订单堆垃圾单
async function reuseOrCreate() {
  const raw = sessionStorage.getItem("tn_order");
  if (raw) {
    try {
      const s = JSON.parse(raw);
      if (Date.now() - s.ts < 30 * 60 * 1000) {
        const st = await post("/order_status",
                              { order_id: s.order_id, query_token: s.query_token });
        if (st.ok && st.paid) { showKey(st.license_key); return null; }
        if (st.ok) return s;                       // 未付 → 复用同单同金额同码
      }
    } catch (e) { /* 解析/查询失败 → 重建 */ }
    sessionStorage.removeItem("tn_order");
  }
  let o;
  try { o = await post("/create_order", {}); }
  catch (e) { fail("无法连接服务，请稍后重试"); return null; }
  if (!o.ok) {
    fail(o.err === "rate_limited"
         ? "下单过于频繁，请稍后刷新重试"
         : o.err === "pay_not_configured"
         ? "支付通道开通中，请稍后再试"
         : o.err === "pay_unavailable"
         ? "支付网关暂不可用，请稍后刷新重试"
         : o.err === "tail_exhausted"
         ? "当前下单人数较多，请稍后刷新重试"
         : "创建订单失败：" + (o.err || "unknown"),
         (o.err === "pay_not_configured" || o.err === "pay_unavailable"
          || o.err === "tail_exhausted") ? "notice" : undefined);
    return null;
  }
  sessionStorage.setItem("tn_order", JSON.stringify(
    { ts: Date.now(), order_id: o.order_id, query_token: o.query_token,
      amount_cents: o.amount_cents, pay_url: o.pay_url, qr: o.qr }));
  return o;
}

(async () => {
  const o = await reuseOrCreate();
  if (!o) return;   // 已 fail 或已显示激活码

  document.getElementById("amount").textContent = "¥" + (o.amount_cents / 100).toFixed(2);
  await loadQR(0);
  // 二维码文本必须是收银台链接（pay_url）：支付宝扫它直达付款；
  // qr 字段是虎皮椒「二维码图片链接」，当文本套码会造成扫出第二个码。
  renderPay(o.pay_url || o.qr);

  const timer = setInterval(async () => {
    let s;
    // query_token 由 create_order 下发，查单必须回传（防 order_id 被枚举取码）
    try { s = await post("/order_status", { order_id: o.order_id,
                                            query_token: o.query_token || "" }); }
    catch (e) { return; }
    if (!s.ok) {
      const tip = document.getElementById("polling");
      if (s.err === "rate_limited") { tip.textContent = "查询过于频繁，稍候自动重试…"; return; }
      // 终态错误（订单不存在/凭证不符）才停；server_error 等瞬态错误继续轮询
      if (s.err === "bad_token" || s.err === "unknown_order") {
        clearInterval(timer);
        return fail("查单失败：" + (s.err || "unknown") + "，请刷新页面重试");
      }
      tip.textContent = "查询暂时失败，自动重试中…";
      return;
    }
    if (s.paid) {
      clearInterval(timer);
      sessionStorage.removeItem("tn_order");
      showKey(s.license_key);
    }
  }, 3000);
  setTimeout(() => { clearInterval(timer);
    document.getElementById("polling").textContent = "订单超时，请刷新页面重试"; }, 3600000);
})();

document.getElementById("copy").onclick = async () => {
  const text = document.getElementById("key").textContent;
  const btn = document.getElementById("copy");
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = "已复制 ✓";
  } catch (e) {
    // 非 HTTPS / 权限被拒：退化为选中文本，让买家手动 Ctrl+C
    const range = document.createRange();
    range.selectNodeContents(document.getElementById("key"));
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    btn.textContent = "已选中，请按 Ctrl+C";
  }
  setTimeout(() => { btn.textContent = "复制激活码"; }, 2000);
};
</script>
</body>
</html>
